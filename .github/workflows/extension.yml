name: Reusable workflow for releasing Meta Box extensions
on:
  workflow_call:
    secrets:
      SSH_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      SSH_USERNAME:
        required: true
      SERVER_IP:
        required: true
      DOWNLOADS_DIR:
        required: true
      SLACK_WEBHOOK:
        required: true
      VERSION_SECRET:
        required: true
jobs:
  release:
    name: Release to Meta Box website
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Checkout
        uses: actions/checkout@v2
      - name: Create zip, upload and notify Slack
        run: |
          name=$(basename -s .git $(git config --get remote.origin.url))
          git archive -o $name.zip --prefix=$name/ HEAD
          # Tag push: version = tag. Manual re-release on master: version = "Version:" header of the main file, so the zip of that version is overwritten.
          if [ "${{ github.ref_type }}" = tag ]; then
            tag=${{ github.ref_name }}
          else
            tag=$(sed -n 's/^[ *]*Version:[ ]*//p' $name.php | head -1 | tr -d '\r ')
          fi
          # Beta (e.g. 2.13.0-beta.1): only in versions/ for manual download on My Account. Don't touch the latest zip, so users don't get it via auto update.
          case $tag in *-*) beta=1 ;; *) beta= ;; esac
          [ -n "$beta" ] || rsync -e "ssh -o StrictHostKeyChecking=no" $name.zip ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }}:${{ secrets.DOWNLOADS_DIR }}
          if [ -n "$tag" ]; then
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p ${{ secrets.DOWNLOADS_DIR }}/versions/$name"
            rsync -e "ssh -o StrictHostKeyChecking=no" $name.zip "${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }}:${{ secrets.DOWNLOADS_DIR }}/versions/$name/$name-$tag.zip"
          fi
          label=$tag; [ -z "$beta" ] || label="$tag (beta)"
          curl -X POST --data-urlencode "payload={\"channel\": \"#meta-box\", \"username\": \"Bot\", \"text\": \"New version $label for $name has been just released!\", \"icon_emoji\": \":tada:\"}" ${{ secrets.SLACK_WEBHOOK }}
          # Beta: don't update the version (the updater would push it to users) or the public changelog.
          [ -z "$beta" ] || exit 0
          curl -X POST --url "https://metabox.io/wp-json/buse2/version/?secret=${{ secrets.VERSION_SECRET }}&slug=$name&version=$tag"
          [ -f CHANGELOG.md ] && rsync -e "ssh -o StrictHostKeyChecking=no" -avz CHANGELOG.md "${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }}:${{ secrets.DOWNLOADS_DIR }}/changelogs/$name.md"
