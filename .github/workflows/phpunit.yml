name: Reusable workflow for running PHPUnit tests
# Runs `composer test` against a fresh WordPress. The calling repo needs the files from the unit test standard:
# phpunit.xml, tests/bootstrap.php, tests/wp-config.php and the "test" script in composer.json.
# Only repos with tests call it.
on:
  workflow_call:
    inputs:
      php:
        description: PHP version
        type: string
        default: "8.3"
      wp:
        description: WordPress version ("latest", "nightly" or a number like "6.9")
        type: string
        default: latest
    # secrets: inherit does not reach this workflow from other orgs (e.g. elightup); those callers pass them explicitly.
    secrets:
      SSH_KEY:
        required: false
      SSH_KNOWN_HOSTS:
        required: false
      COMPOSER_TOKEN:
        required: false

jobs:
  phpunit:
    name: PHPUnit (WP ${{ inputs.wp }}, PHP ${{ inputs.php }})
    runs-on: ubuntu-latest
    env:
      WP_CORE_DIR: /tmp/wordpress
      COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php }}
          extensions: mysqli
          tools: composer, wp-cli
          coverage: none
      # Only for repos that need private packages: SSH_KEY for git@ URLs, or COMPOSER_TOKEN.
      - if: env.SSH_KEY != ''
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - if: env.COMPOSER_TOKEN != ''
        run: composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
      - run: wp core download --path="$WP_CORE_DIR" --version="${{ inputs.wp }}"
      - run: composer install --no-interaction --no-progress
      - run: composer test
